<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}StockPredict{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<nav class="sp-nav">
  <div class="sp-nav-inner">
    <a class="sp-brand" href="{{ url_for('views.home') }}">
      <span class="sp-brand-mark">SP</span><span class="sp-brand-name">StockPredict</span>
    </a>
    <div class="sp-nav-links">
      <a href="{{ url_for('views.dashboard') }}" class="{{ 'active' if request.endpoint == 'views.dashboard' }}">Dashboard</a>
      <a href="{{ url_for('views.data_quality') }}" class="{{ 'active' if request.endpoint == 'views.data_quality' }}">Data Quality</a>
      <a href="{{ url_for('views.eda') }}" class="{{ 'active' if request.endpoint == 'views.eda' }}">EDA</a>
      <a href="{{ url_for('views.backtest') }}" class="{{ 'active' if request.endpoint == 'views.backtest' }}">Backtest</a>
    </div>
    <div class="sp-nav-status">
      <span class="sp-dot"></span> Live pipeline
    </div>
  </div>
</nav>

<main>
{% block content %}{% endblock %}
</main>

<footer class="sp-footer">
  <div class="sp-footer-inner">
    <span>StockPredict &mdash; built on the WQU MScFE market-prediction research pipeline</span>
    <span class="sp-footer-muted">Data via Yahoo Finance &middot; Not investment advice</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
